name: Reset demo data

# Wipes visitors' test bookings and accounts every night and restores the demo schedule.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SITE_URL     e.g. https://urban-clippers.netlify.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Netlify

on:
  schedule:
    - cron: "30 20 * * *" # 02:30 in Dhaka, after closing time
  workflow_dispatch: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reset endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add the SITE_URL and CRON_SECRET repository secrets first."; exit 1
          fi
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/reset-demo"
